<div class="pub-shell">
  <header class="pub-header">
    <div class="pub-header-inner">
      <NuxtLink to="/public" class="pub-logo">🎟️ Eventos Boyacá</NuxtLink>
      <div class="pub-header-actions">
        <div class="user-menu" v-click-outside="closeDropdown">
          <button class="user-icon-btn" @click="dropdownOpen = !dropdownOpen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <circle
                cx="12"
                cy="7"
                r="4"
                stroke="currentColor"
                stroke-width="1.8"
              />
            </svg>
          </button>
          <Transition name="dropdown">
            <div v-if="dropdownOpen" class="pub-dropdown">
              <div class="pub-dropdown-header">
                <div class="pub-dropdown-name">{{ user?.name }}</div>
                <div class="pub-dropdown-email">{{ user?.email }}</div>
              </div>
              <div class="pub-dropdown-divider"></div>
              <NuxtLink
                to="/public/profile"
                class="pub-dropdown-item active-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                  <circle
                    cx="12"
                    cy="7"
                    r="4"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
                Ver perfil
              </NuxtLink>
              <NuxtLink
                to="/public/favorites"
                class="pub-dropdown-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
                Ver favoritos
              </NuxtLink>
              <NuxtLink
                to="/public/purchases"
                class="pub-dropdown-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M3 6h18M16 10a4 4 0 01-8 0"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Mis compras
              </NuxtLink>
              <div class="pub-dropdown-divider"></div>
              <button
                class="pub-dropdown-item pub-dropdown-item--danger"
                @click="handleLogout"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
                Cerrar sesión
              </button>
            </div>
          </Transition>
        </div>
      </div>
    </div>
  </header>

  <main class="pub-main">
    <div class="profile-wrap">
      <div class="profile-card">
        <div class="profile-header">
          <div class="profile-avatar">{{ initials }}</div>
          <div>
            <div class="profile-name">{{ user?.name }}</div>
            <span class="profile-role-badge">Usuario externo</span>
          </div>
        </div>

        <div class="profile-body">
          <div class="profile-row">
            <div class="profile-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path
                  d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <circle
                  cx="12"
                  cy="7"
                  r="4"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
              </svg>
              Nombre
            </div>
            <div class="profile-value">{{ user?.name ?? '—' }}</div>
          </div>

          <div class="profile-row">
            <div class="profile-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path
                  d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <path
                  d="M22 6l-10 7L2 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
              Correo
            </div>
            <div class="profile-value">{{ user?.email ?? '—' }}</div>
          </div>

          <div class="profile-row">
            <div class="profile-label">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <rect
                  x="3"
                  y="4"
                  width="18"
                  height="18"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M16 2v4M8 2v4M3 10h18"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
              Miembro desde
            </div>
            <div class="profile-value">{{ formattedDate }}</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
