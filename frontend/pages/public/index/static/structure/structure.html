<div class="pub-shell">
  <header class="pub-header">
    <div class="pub-header-inner">
      <span class="pub-logo">🎟️ Eventos Boyacá</span>

      <div class="user-menu" v-click-outside="closeDropdown">
        <button class="user-icon-btn" @click="dropdownOpen = !dropdownOpen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path
              d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <circle
              cx="12"
              cy="7"
              r="4"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        </button>
        <Transition name="dropdown">
          <div v-if="dropdownOpen" class="pub-dropdown">
            <template v-if="!isGuest">
              <div class="pub-dropdown-header">
                <div class="pub-dropdown-name">{{ user?.name }}</div>
                <div class="pub-dropdown-email">{{ user?.email }}</div>
              </div>
              <div class="pub-dropdown-divider"></div>
              <NuxtLink
                to="/public/profile"
                class="pub-dropdown-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                  <circle
                    cx="12"
                    cy="7"
                    r="4"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                </svg>
                Ver perfil
              </NuxtLink>
              <NuxtLink
                to="/public/favorites"
                class="pub-dropdown-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
                Ver favoritos
              </NuxtLink>
              <NuxtLink
                to="/public/purchases"
                class="pub-dropdown-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M3 6h18M16 10a4 4 0 01-8 0"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Mis compras
              </NuxtLink>
              <div class="pub-dropdown-divider"></div>
              <button
                class="pub-dropdown-item pub-dropdown-item--danger"
                @click="handleLogout"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
                Cerrar sesión
              </button>
            </template>
            <template v-else>
              <div class="pub-dropdown-header">
                <div class="pub-dropdown-name">Bienvenido</div>
                <div class="pub-dropdown-email">Accede a tu cuenta</div>
              </div>
              <div class="pub-dropdown-divider"></div>
              <NuxtLink
                to="/login"
                class="pub-dropdown-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
                Iniciar sesión
              </NuxtLink>
              <NuxtLink
                to="/register"
                class="pub-dropdown-item"
                @click="closeDropdown"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M12 3a4 4 0 110 8 4 4 0 010-8zM20 8v6M23 11h-6"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
                Registrarse
              </NuxtLink>
            </template>
          </div>
        </Transition>
      </div>
    </div>
  </header>

  <main class="pub-main">
    <div class="pub-head">
      <h2 class="pub-title">Explora los eventos</h2>
      <p class="pub-count">{{ filtered.length }} evento(s) encontrado(s)</p>
    </div>

    <div class="pub-search">
      <SearchBar
        :categories="sortedActiveCategories"
        @update:query="(q) => (query = q)"
        @update:category="(c) => (selectedCategory = c)"
      />
    </div>

    <div class="pub-content">
      <aside class="pub-aside">
        <Filters @update:filters="(f) => (activeFilters = f)" />
      </aside>
      <section class="pub-grid-wrap">
        <div
          v-if="loading"
          style="text-align: center; padding: 48px; color: var(--text-muted)"
        >
          Cargando eventos…
        </div>
        <div v-else class="pub-grid">
          <EventCard v-for="e in filtered" :key="e.id_event" :event="e" />
        </div>
        <div v-if="!loading && filtered.length === 0" class="pub-empty">
          <p>🎟️</p>
          <p>No se encontraron eventos</p>
        </div>
      </section>
    </div>
  </main>
</div>
