name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancela el run anterior si se hace un nuevo push al mismo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos necesarios
permissions:
  contents: read

jobs:
  backend:
    name: Verificar Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Generar cliente Prisma
        run: npx prisma generate --no-hints

      - name: Verificar sintaxis (todos los archivos)
        run: find src -name "*.js" | xargs node --check

      - name: Lint
        run: npm run lint

      - name: Tests y cobertura
        run: npm run test:coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/
          retention-days: 7

      - name: Auditoría de seguridad
        run: npm audit --audit-level=critical --omit=dev

  frontend:
    name: Verificar Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npx prettier --check .

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Tests y cobertura
        run: npm run test:coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

      - name: Construir aplicación
        run: npm run build
